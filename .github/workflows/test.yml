name: Synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: assets/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assets/worker/package-lock.json
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm test
